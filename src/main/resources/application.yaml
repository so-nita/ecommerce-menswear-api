spring:
  application:
    name: ecommerce-api

#  postgresql://postgres_user:PLydM3cqJN5pCM3GJGmIPFxuNQREp89H@dpg-d989dcm7r5hc73cngdi0-a.singapore-postgres.render.com/ecommerce_menswear_dev
  spring:
    datasource:
      url: jdbc:postgresql://dpg-d989dcm7r5hc73cngdi0-a.singapore-postgres.render.com:5432/ecommerce_menswear_dev?sslmode=require
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

springdoc:
  api-docs:
    path: /swagger
  swagger-ui:
    path: /index.html
    operations-sorter: alpha
    tags-sorter: alpha

server:
  port: 8088

minio:
  endpoint: http://localhost:9002
  access-key: minioadmin
  secret-key: minioadmin
  bucket: ecommerce-menswear

app:
  jwt:
    secret: dev-only-secret-do-not-use-in-prod
    issuer: http://localhost:8088
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000