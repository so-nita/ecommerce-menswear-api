services:
  postgres:
    container_name: ecommerce-postgres-prod
    # NO ports section — DB is not accessible from outside Docker network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  app:
    container_name: ecommerce-api-prod
    image: ghcr.io/youruser/ecommerce-api:${APP_VERSION:-latest}   # ← pre-built image, not build from source
    environment:
      SPRING_PROFILES_ACTIVE: production
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"